[buildPlans.Jetsevka]
family = "Jetsevka"
spacing = "normal"
serifs = "sans"
noCvSs = true
exportGlyphNames = false

[buildPlans.Jetsevka.variants]
inherits = "ss14"

[buildPlans.Jetsevka.variants.design]
three = "two-arcs"
four = "closed-serifless"
five = "upright-flat-hook-serifless"
seven = "straight-serifless"
zero = "slashed"
capital-b = "more-asymmetric-serifless"
capital-e = "serifless"
capital-j = "serifed"
capital-q = "detached-bend-tailed"
capital-w = "straight-serifless"
a = "single-storey-serifed"
g = "single-storey-serifless"
l = "serifed-flat-tailed"
u = "toothed-serifless"
w = "straight-serifless"
y = "straight-turn-serifless"
at = "compact"

[buildPlans.Jetsevka.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.Jetsevka.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.Jetsevka.weights.Medium]
shape = 500
menu = 500
css = 500

[buildPlans.Jetsevka.widths.Normal]
shape = 528
menu = 5
css = "normal"

[buildPlans.Jetsevka.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.Jetsevka.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"
