[buildPlans.Firax]
family = "Firax"
spacing = "normal"
serifs = "sans"
no-cv-ss = false
no-ligation = false
webfont-formats = ['woff2']

###################################################################################################
# Configure variants

[buildPlans.Firax.variants]
inherits = "ss05"

[buildPlans.Firax.variants.design]
    one = "base-long-top-serif"
    eight = "two-circles"
    zero = "oval-tall-slashed"
    f = "serifless"
    r = "corner-hooked-base-serifed"
    punctuation-dot = "round"
    asterisk = "penta-low"
    underscore = "high"
    paren = "large-contour"
    brace = "curly-flat-boundary"
    number-sign = "upright-tall"
    at = "fourfold"
    percent = "rings-segmented-slash"

    [buildPlans.Firax.variants.italic]
    a = "single-storey-tailed"
    f = "tailed"
    r = "corner-hooked-base-serifed"
    at = "compact"
###################################################################################################
# Configure ligations

[buildPlans.Firax.ligations]
inherits = "default-calt"
disables = []
enables  = [
    "center-ops",
    "arrow-l-hyphen",
    "arrow-r-hyphen",
    "arrow-lr-hyphen",
    "arrow-l-equal",
    "arrow-r-equal",
    "arrow-lr-equal",
    "trig",
    "eqeqeq",
    "eqeq",
    "lteq",
    "gteq",
    "exeqeq",
    "exeq",
    "brst",
    "plus-plus",
    "kern-dotty",
    "kern-bars",
    "logic",
    "llgg",
    "llggeq",
    "html-comment"
]

[buildPlans.Firax.weights.Regular]
shape = 415
menu = 400
css = 400
[buildPlans.Firax.weights.Bold]
shape = 700
menu = 700
css = 700
[buildPlans.Firax.weights.Medium]
shape = 510
menu = 500
css = 500
[buildPlans.Firax.widths.Normal]
shape = 528
menu = 5
css = "normal"
[buildPlans.Firax.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"
[buildPlans.Firax.slopes.Italic]
angle = 9.5
shape = "italic"
menu = "italic"
css = "italic"
# Metric overrides
#[buildPlans.Firax.metricOverride]
#xHeight = 540
#cap = 720
#ascender = 735
#sb = 'blend(weight, [400, 90], [700, 78])'
#accentWidth = 200
#accentClearance = 80
#accentHeight = 170
#accentStackOffset = 208
#leading = 1170
#parenSize = 950
#periodSize = 150
#essRatio = 1.03
#essRatioUpper = 1.03
#essRatioLower = 1.03
#essRatioQuestion = 1.03
#archDepth = 185
#smallArchDepth = 190
